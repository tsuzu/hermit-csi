name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: lint + unit/e2e (fake LVM, in-memory S3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install thin-provisioning-tools (for TestRealThinTools)
        run: sudo apt-get update && sudo apt-get install -y thin-provisioning-tools
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1

  integration:
    name: integration (real LVM thin pools + MinIO)
    runs-on: ubuntu-24.04
    needs: unit
    env:
      HERMIT_IT_VG_A: it-a
      HERMIT_IT_VG_B: it-b
      HERMIT_IT_POOL: pool
      HERMIT_IT_S3_ENDPOINT: http://127.0.0.1:9000
      HERMIT_IT_BUCKET: hermit-it
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      MINIO_REF: RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install LVM tools
        run: sudo apt-get update && sudo apt-get install -y lvm2 thin-provisioning-tools xfsprogs e2fsprogs
      # Open-source MinIO is archived: Docker Hub / quay.io images and dl.min.io
      # binaries are no longer published, so build the last release from source.
      - name: Cache MinIO binary
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-${{ env.MINIO_REF }}-${{ runner.os }}
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MINIO_REF" https://github.com/minio/minio.git "$RUNNER_TEMP/minio-src"
          cd "$RUNNER_TEMP/minio-src"
          CGO_ENABLED=0 go build -trimpath -o ~/minio-bin/minio .
      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY \
            nohup ~/minio-bin/minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          aws --endpoint-url $HERMIT_IT_S3_ENDPOINT s3 mb s3://$HERMIT_IT_BUCKET
      - name: Create thin pools on loop devices
        run: sudo -E hack/it-setup.sh up
      - name: Build test binary
        run: go test -c -tags integration -o driver.test ./pkg/driver/
      - name: Run integration tests (root)
        run: sudo -E ./driver.test -test.run 'Integration' -test.v -test.count=1 -test.timeout=15m
      - name: Debug on failure
        if: failure()
        run: |
          sudo lvs -a -o+thin_id,lv_tags || true
          sudo dmsetup ls || true
          tail -50 "$RUNNER_TEMP/minio.log" || true
      - name: Tear down
        if: always()
        run: sudo -E hack/it-setup.sh down

  image:
    name: container image
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hermit-csi:ci
