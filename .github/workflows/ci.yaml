name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: lint + unit/e2e (fake LVM, in-memory S3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install thin-provisioning-tools (for TestRealThinTools)
        run: sudo apt-get update && sudo apt-get install -y thin-provisioning-tools
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1

  scheduler:
    name: scheduler plugin (vet + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scheduler/go.mod
          cache-dependency-path: scheduler/go.sum
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  manifests:
    name: manifests + alert rules (kustomize, promtool)
    runs-on: ubuntu-24.04
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0
    steps:
      - uses: actions/checkout@v4
      - name: Build the manifests
        run: |
          kubectl kustomize deploy >/dev/null
          kubectl kustomize deploy/scheduler >/dev/null
          kubectl kustomize test/prometheus >/dev/null
      - name: Check and unit-test the alert rules
        run: |
          yq '.spec' deploy/components/prometheus/rules.yaml > test/prometheus/rules.yaml
          docker run --rm -v "$PWD/test/prometheus:/w" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" check rules rules.yaml
          docker run --rm -v "$PWD/test/prometheus:/w" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" test rules rules_test.yaml

  integration:
    name: integration (real LVM thin pools + ${{ matrix.s3 }})
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        s3: [minio, seaweedfs]
    env:
      SEAWEEDFS_VERSION: "4.53"
      HERMIT_IT_VG_A: it-a
      HERMIT_IT_VG_B: it-b
      HERMIT_IT_POOL: pool
      HERMIT_IT_S3_ENDPOINT: http://127.0.0.1:9000
      HERMIT_IT_BUCKET: hermit-it
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install LVM tools
        run: sudo apt-get update && sudo apt-get install -y lvm2 thin-provisioning-tools xfsprogs e2fsprogs
      - if: matrix.s3 == 'minio'
        uses: ./.github/actions/minio
        with:
          bucket: ${{ env.HERMIT_IT_BUCKET }}
      - name: Start SeaweedFS
        if: matrix.s3 == 'seaweedfs'
        run: |
          printf '{"identities":[{"name":"hermit","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > "$RUNNER_TEMP/s3.json"
          docker run -d --name seaweedfs -p 9000:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            "chrislusf/seaweedfs:$SEAWEEDFS_VERSION" server -dir=/data -s3 -s3.config=/etc/s3.json -ip.bind=0.0.0.0
          for i in $(seq 1 60); do
            aws --endpoint-url "$HERMIT_IT_S3_ENDPOINT" s3 mb "s3://$HERMIT_IT_BUCKET" 2>/dev/null && break
            sleep 1
          done
          aws --endpoint-url "$HERMIT_IT_S3_ENDPOINT" s3 ls "s3://$HERMIT_IT_BUCKET"
          docker exec seaweedfs weed version
      - name: Create thin pools on loop devices
        run: sudo -E hack/it-setup.sh up
      - name: Build test binary
        run: go test -c -tags integration -o driver.test ./pkg/driver/
      - name: Run integration tests (root)
        run: sudo -E ./driver.test -test.run 'Integration' -test.v -test.count=1 -test.timeout=15m
      - name: Debug on failure
        if: failure()
        run: |
          sudo lvs -a -o+thin_id,lv_tags || true
          sudo dmsetup ls || true
          docker logs seaweedfs 2>&1 | tail -50 || true
          tail -50 "$RUNNER_TEMP/minio.log" || true
      - name: Tear down
        if: always()
        run: sudo -E hack/it-setup.sh down

  e2e:
    name: e2e (kind, released manifests, ${{ matrix.s3 }} STS)
    runs-on: ubuntu-24.04
    needs: [unit, scheduler]
    strategy:
      fail-fast: false
      matrix:
        s3: [minio, seaweedfs]
    env:
      KIND_VERSION: v0.33.0
      E2E_S3: ${{ matrix.s3 }}
      SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.53
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install LVM tools and kind
        run: |
          sudo apt-get update && sudo apt-get install -y lvm2 thin-provisioning-tools
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version && kubectl version --client
      # run.sh starts it once the cluster exists (its STS trusts the cluster).
      - if: matrix.s3 == 'minio'
        uses: ./.github/actions/minio
        with:
          start: "false"
      - uses: docker/setup-buildx-action@v3
      - name: Build driver image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/tsuzu/hermit-csi:e2e
          cache-from: type=gha,scope=driver
          cache-to: type=gha,scope=driver,mode=max
      - name: Build scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scheduler/Dockerfile
          load: true
          tags: ghcr.io/tsuzu/hermit-scheduler:e2e
          cache-from: type=gha,scope=scheduler
          cache-to: type=gha,scope=scheduler,mode=max
      - name: Create cluster and deploy
        run: test/e2e/run.sh up
      - name: Run e2e tests
        run: test/e2e/run.sh test
      - name: Dump state on failure
        if: failure()
        run: |
          test/e2e/run.sh dump || true
      - name: Tear down
        if: always()
        run: test/e2e/run.sh down

  image:
    name: container image
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hermit-csi:ci
          cache-from: type=gha,scope=driver
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scheduler/Dockerfile
          push: false
          tags: hermit-scheduler:ci
          cache-from: type=gha,scope=scheduler
