apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: hermit
  volumeMode: Block
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: block-user
spec:
  # Optional (deploy/scheduler/): prefer the node that already has this volume.
  # schedulerName: hermit-scheduler
  containers:
    - name: app
      image: busybox
      command: [sh, -c, "dd if=/dev/urandom of=/dev/xvda bs=1M count=10 conv=fsync && sleep 3600"]
      volumeDevices:
        - {name: data, devicePath: /dev/xvda}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: data}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: data-snap
spec:
  volumeSnapshotClassName: hermit
  source:
    persistentVolumeClaimName: data
