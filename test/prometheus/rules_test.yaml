# promtool unit tests for deploy/components/prometheus/rules.yaml.
# CI extracts the rule groups to rules.yaml (yq '.spec') and runs
#   promtool test rules test/prometheus/rules_test.yaml
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # vol-ok is backed up every 2m; vol-stuck stops at t=0 (interval 2m, so the
  # 15m floor applies); vol-off has periodic backups disabled.
  - interval: 1m
    input_series:
      - series: hermit_volume_last_backup_timestamp_seconds{pod="node-a",volume="vol-ok"}
        values: 0+60x40
      - series: hermit_volume_backup_interval_seconds{pod="node-a",volume="vol-ok"}
        values: 120x40
      - series: hermit_volume_last_backup_timestamp_seconds{pod="node-a",volume="vol-stuck"}
        values: 0x40
      - series: hermit_volume_backup_interval_seconds{pod="node-a",volume="vol-stuck"}
        values: 120x40
      - series: hermit_volume_last_backup_timestamp_seconds{pod="node-a",volume="vol-off"}
        values: 0x40
      - series: hermit_volume_backup_interval_seconds{pod="node-a",volume="vol-off"}
        values: 0x40
    alert_rule_test:
      - eval_time: 18m # stale for 15m but not yet for the 5m "for"
        alertname: HermitBackupStale
        exp_alerts: []
      - eval_time: 25m
        alertname: HermitBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, pod: node-a, volume: vol-stuck}
            exp_annotations:
              summary: Volume vol-stuck has not been backed up to S3 recently
              description: >-
                The last successful backup of vol-stuck on node-a was 25m 0s ago. Data written since then
                would be lost if the node failed.
  # A long interval raises the threshold above the floor.
  - interval: 1m
    input_series:
      - series: hermit_volume_last_backup_timestamp_seconds{pod="node-a",volume="vol-hourly"}
        values: 0x200
      - series: hermit_volume_backup_interval_seconds{pod="node-a",volume="vol-hourly"}
        values: 3600x200
    alert_rule_test:
      - eval_time: 2h
        alertname: HermitBackupStale
        exp_alerts: []
      - eval_time: 3h10m
        alertname: HermitBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, pod: node-a, volume: vol-hourly}
            exp_annotations:
              summary: Volume vol-hourly has not been backed up to S3 recently
              description: >-
                The last successful backup of vol-hourly on node-a was 3h 10m 0s ago. Data written since then
                would be lost if the node failed.
  - interval: 1m
    input_series:
      - series: hermit_volume_backup_consecutive_failures{pod="node-a",volume="vol"}
        values: 0 1 2 3
      - series: hermit_volume_fenced{pod="node-a",volume="vol"}
        values: 1x20
    alert_rule_test:
      - eval_time: 2m
        alertname: HermitBackupFailing
        exp_alerts: []
      - eval_time: 3m
        alertname: HermitBackupFailing
        exp_alerts:
          - exp_labels: {severity: warning, pod: node-a, volume: vol}
            exp_annotations:
              summary: Backups of vol keep failing
              description: >-
                3 backups in a row of vol on node-a failed; see the node plugin logs ("periodic backup failed").
      - eval_time: 16m
        alertname: HermitVolumeFenced
        exp_alerts:
          - exp_labels: {severity: critical, pod: node-a, volume: vol}
            exp_annotations:
              summary: Volume vol is still staged on a node that lost ownership
              description: >-
                Another node took over vol (e.g. after a force detach), but it is still staged on node-a.
                Writes there are no longer backed up and will be lost; stop the pod still using it on that node.
  - interval: 1h
    input_series:
      - series: hermit_fstrim_total{pod="node-a",result="failure"}
        values: 0 0 1 1x60
    alert_rule_test:
      - eval_time: 1h
        alertname: HermitFstrimFailing
        exp_alerts: []
      - eval_time: 3h
        alertname: HermitFstrimFailing
        exp_alerts:
          - exp_labels: {severity: info, pod: node-a, result: failure}
            exp_annotations:
              summary: fstrim of a filesystem volume failed on node-a
              description: >-
                Blocks of deleted files are not returned to the thin pool, which keeps filling up;
                see the node plugin logs ("fstrim failed").
      - eval_time: 60h # no new failure for 2 days
        alertname: HermitFstrimFailing
        exp_alerts: []
  # An unstage in flight: its age grows by 60s per minute, crosses the 15m
  # threshold at 16m, and fires after the 5m "for" at 21m.
  - interval: 1m
    input_series:
      - series: hermit_operation_in_flight_age_seconds{pod="node-a",volume="vol",operation="unstage"}
        values: 0+60x30
    alert_rule_test:
      - eval_time: 20m
        alertname: HermitOperationStuck
        exp_alerts: []
      - eval_time: 22m
        alertname: HermitOperationStuck
        exp_alerts:
          - exp_labels: {severity: warning, pod: node-a, volume: vol, operation: unstage}
            exp_annotations:
              summary: A unstage of volume vol has been in flight for 22m 0s on node-a
              description: >-
                The operation should have finished or been abandoned at --op-timeout. Check the S3
                endpoint and the node plugin logs ("operation exceeded its maximum lifetime").
  - interval: 1m
    input_series:
      - series: hermit_backups_total{pod="node-a",trigger="unstage",result="failure"}
        values: 0 0 0 1x20
    alert_rule_test:
      - eval_time: 2m
        alertname: HermitUnstageBackupFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: HermitUnstageBackupFailing
        exp_alerts:
          - exp_labels: {severity: warning, pod: node-a, trigger: unstage, result: failure}
            exp_annotations:
              summary: The final backup at unstage is failing on node-a
              description: >-
                Volumes cannot finish unstaging from node-a until their final backup to S3
                succeeds; pods leaving the node hang in Terminating. Check the S3 endpoint and the
                node plugin logs ("final backup of").
