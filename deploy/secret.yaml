# Edit before applying. The agent token authenticates controller -> node snapshot requests.
#
# S3 credentials, one of:
#   - static keys: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY below
#   - an IAM role (recommended): leave the keys out and either
#       * EKS IRSA: annotate the service accounts with eks.amazonaws.com/role-arn, or
#       * any cluster: set S3_ROLE_ARN below and add the components/web-identity
#         kustomize component (projected service account token)
#     An explicitly configured role is used even if static keys are present.
apiVersion: v1
kind: Secret
metadata:
  name: hermit-csi
  namespace: kube-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  HERMIT_AGENT_TOKEN: CHANGE_ME_RANDOM
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermit-csi
  namespace: kube-system
data:
  S3_BUCKET: my-hermit-bucket
  S3_PREFIX: cluster-1
  S3_ENDPOINT: ""          # e.g. http://minio.minio.svc:9000 ; empty = AWS
  S3_REGION: ap-northeast-1
  S3_PATH_STYLE: "false"
  # IAM role to assume for S3 (optional, see above):
  # S3_ROLE_ARN: arn:aws:iam::123456789012:role/hermit-csi
  # S3_ROLE_SESSION_NAME: hermit-csi
  # S3_STS_ENDPOINT: ""    # non-AWS STS (e.g. MinIO), or a VPC endpoint
