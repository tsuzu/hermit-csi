# Edit before applying. The agent token authenticates controller -> node snapshot requests.
apiVersion: v1
kind: Secret
metadata:
  name: s3lvm-csi
  namespace: kube-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  S3LVM_AGENT_TOKEN: CHANGE_ME_RANDOM
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3lvm-csi
  namespace: kube-system
data:
  S3_BUCKET: my-s3lvm-bucket
  S3_PREFIX: cluster-1
  S3_ENDPOINT: ""          # e.g. http://minio.minio.svc:9000 ; empty = AWS
  S3_REGION: ap-northeast-1
  S3_PATH_STYLE: "false"
