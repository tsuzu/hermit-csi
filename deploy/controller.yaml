apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3lvm-csi-controller
  namespace: kube-system
spec:
  replicas: 1   # the driver's per-volume locks are in-process; keep a single replica
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: s3lvm-csi-controller}
  template:
    metadata:
      labels: {app: s3lvm-csi-controller}
    spec:
      serviceAccountName: s3lvm-csi-controller
      priorityClassName: system-cluster-critical
      containers:
        - name: driver
          image: ghcr.io/tsuzu/s3lvm-csi:latest
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --s3-bucket=$(S3_BUCKET)
            - --s3-prefix=$(S3_PREFIX)
            - --s3-endpoint=$(S3_ENDPOINT)
            - --s3-region=$(S3_REGION)
            - --s3-path-style=$(S3_PATH_STYLE)
            - --gc-interval=1h
            - --gc-grace=24h
          envFrom:
            - configMapRef: {name: s3lvm-csi}
            - secretRef: {name: s3lvm-csi}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
          args: [--csi-address=/csi/csi.sock, --leader-election, --timeout=2m, --default-fstype=ext4]
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.8.0
          args: [--csi-address=/csi/csi.sock, --leader-election, --timeout=2m]
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
          # In-use snapshots upload the delta first; allow time for it.
          args: [--csi-address=/csi/csi.sock, --leader-election, --timeout=10m]
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
      volumes:
        - name: socket-dir
          emptyDir: {}
