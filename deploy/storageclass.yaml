apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hermit
provisioner: hermit.csi.tsuzu.dev
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
parameters:
  # Periodic backup interval for volumes of this class (Go duration, >= 10s).
  # Omit to use the node's --backup-interval (default 5m).
  backupInterval: 5m
---
# Requires the snapshot CRDs and snapshot-controller (kubernetes-csi/external-snapshotter).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: hermit
driver: hermit.csi.tsuzu.dev
deletionPolicy: Delete
