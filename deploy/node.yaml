apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: s3lvm-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels: {app: s3lvm-csi-node}
  template:
    metadata:
      labels: {app: s3lvm-csi-node}
    spec:
      serviceAccountName: s3lvm-csi-node
      priorityClassName: system-node-critical
      # Give the final backup in NodeUnstage time to finish on shutdown.
      terminationGracePeriodSeconds: 600
      # Only nodes that have the VG/thin pool prepared.
      nodeSelector:
        s3lvm.csi.example.com/enabled: "true"
      containers:
        - name: driver
          image: ghcr.io/example/s3lvm-csi:latest
          securityContext:
            privileged: true
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            - --vg=s3lvm
            - --thin-pool=pool
            - --state-dir=/var/lib/s3lvm
            - --backup-interval=5m
            - --agent-listen=:9810
            - --agent-advertise=$(POD_IP):9810
            - --s3-bucket=$(S3_BUCKET)
            - --s3-prefix=$(S3_PREFIX)
            - --s3-endpoint=$(S3_ENDPOINT)
            - --s3-region=$(S3_REGION)
            - --s3-path-style=$(S3_PATH_STYLE)
            - --gc-grace=24h   # must match the controller
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          envFrom:
            - configMapRef: {name: s3lvm-csi}
            - secretRef: {name: s3lvm-csi}
          ports:
            - {name: agent, containerPort: 9810}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: kubelet-dir, mountPath: /var/lib/kubelet, mountPropagation: Bidirectional}
            - {name: dev, mountPath: /dev}
            - {name: lvm-lock, mountPath: /run/lock/lvm}
            - {name: state, mountPath: /var/lib/s3lvm}
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/s3lvm.csi.example.com/csi.sock
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: registration-dir, mountPath: /registration}
      volumes:
        - name: socket-dir
          hostPath: {path: /var/lib/kubelet/plugins/s3lvm.csi.example.com, type: DirectoryOrCreate}
        - name: registration-dir
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
        - name: kubelet-dir
          hostPath: {path: /var/lib/kubelet, type: Directory}
        - name: dev
          hostPath: {path: /dev, type: Directory}
        - name: lvm-lock
          hostPath: {path: /run/lock/lvm, type: DirectoryOrCreate}
        - name: state
          hostPath: {path: /var/lib/s3lvm, type: DirectoryOrCreate}
