apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermit-csi-controller
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermit-csi-node
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermit-csi-controller
rules:
  # external-provisioner
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # external-attacher
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch, patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [update]
  # snapshots (provisioner reads them for dataSource, snapshotter manages contents)
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get, list, watch, update, patch, create]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents/status]
    verbs: [update, patch]
  - apiGroups: [groupsnapshot.storage.k8s.io]
    resources: [volumegroupsnapshotclasses, volumegroupsnapshotcontents]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermit-csi-controller
subjects:
  - kind: ServiceAccount
    name: hermit-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: hermit-csi-controller
  apiGroup: rbac.authorization.k8s.io
---
# Leader election for the sidecars.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermit-csi-controller-leases
  namespace: kube-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, watch, list, delete, update, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermit-csi-controller-leases
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: hermit-csi-controller
    namespace: kube-system
roleRef:
  kind: Role
  name: hermit-csi-controller-leases
  apiGroup: rbac.authorization.k8s.io
